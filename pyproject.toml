[project]
name = "manufacturing-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.110",
    "httpx>=0.27",
    "langchain>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "markdown>=3.11",
    "nemoguardrails>=0.14",
    "openai>=1.40",
    "openinference-instrumentation-langchain>=0.1.79",
    "openinference-instrumentation-openai>=0.1.65",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.6",
    "python-dotenv>=1.2.4",
    "ragas>=0.4,<0.5",
    "requests>=2.31",
    "streamlit>=1.40",
    "uvicorn[standard]>=0.30",
    "weaviate-client>=4.9,<5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
